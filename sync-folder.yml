name: Push specific folder to another repo

on:
  push:
    branches: [ Sophomore ]
    paths:
      - 'Java/src/Project/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push folder to target repo
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          API_TOKEN_GITHUB: ${{ secrets.TARGET_REPO_TOKEN }}
        with:
          source-directory: Java\src\Project
          destination-github-username: Gorden498
          destination-repository-name: alphabetE
          user-email: hwgh235@cju.ac.kr
          target-branch: main